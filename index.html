<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171724">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Step Scratchers — Scratch & Find</title>
<meta name="description" content="A quiet, ad-free walking-powered bingo and crossword scratcher game.">
<style>
:root { color-scheme: dark; --bg:#111521; --surface:#22283e; --surface2:#2f3450; --edge:#49526d; --ink:#f7f7ff; --muted:#b8bfd3; --gold:#ffd782; --pink:#ff9dc8; --teal:#8ef2dc; --purple:#b0abff; --success:#97ebb0; --bingoA:#235d61; --bingoB:#365a7a; --crossA:#6a4a77; --crossB:#8a6a37; --collectA:#43585b; --collectB:#314348; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html,body { margin:0; padding:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:ui-rounded, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
body { background: radial-gradient(ellipse at 8% -4%, #3b3465 0, transparent 42%), radial-gradient(ellipse at 96% 18%, #214759 0, transparent 34%), radial-gradient(ellipse at 50% 120%, #294238 0, transparent 28%), var(--bg); }
button { font:inherit; cursor:pointer; touch-action:manipulation; color:inherit; }
button:disabled { opacity:.4; cursor:not-allowed; }
button:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
#app { max-width:570px; margin:0 auto; min-height:100dvh; padding: max(16px, env(safe-area-inset-top)) 16px calc(35px + env(safe-area-inset-bottom)); }
.topbar { display:flex; gap:10px; align-items:center; justify-content:space-between; padding-bottom:8px; }
.brand { font-size:23px; font-weight:900; letter-spacing:-.9px; }
.brand span { color:var(--gold); }
.kicker { font-size:10px; text-transform:uppercase; letter-spacing:1.5px; color:var(--teal); font-weight:800; margin-bottom:5px; }
.demo { border-radius:999px; padding:6px 9px; font-size:10px; letter-spacing:.4px; color:#e8edf7; border:1px solid #5b6481; white-space:nowrap; background:linear-gradient(135deg,#2d3552,#26323b); box-shadow:0 3px 10px #0a0d1740; }
.wallet { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin:14px 0 12px; }
.stat { padding:13px 15px; border:1px solid var(--edge); border-radius:15px; background:linear-gradient(145deg,rgba(42,46,69,.92),rgba(31,38,56,.92)); box-shadow:0 8px 20px #0c102040; animation:softRise .24s ease both; }
.stat small { display:block; color:var(--muted); font-size:11px; letter-spacing:.2px; margin-bottom:6px; }
.stat strong { font-size:26px; font-weight:850; letter-spacing:-.7px; }
.stat em { font-style:normal; color:var(--muted); font-size:11px; margin-left:3px; }
.nav { display:grid; grid-template-columns:repeat(3,1fr); background:linear-gradient(145deg,#2d3046,#25283a); border:1px solid var(--edge); padding:4px; border-radius:14px; gap:4px; margin-bottom:17px; box-shadow:0 8px 20px #0d101d35; }
.nav button { background:transparent; border:0; border-radius:10px; padding:10px 2px; font-size:13px; color:var(--muted); font-weight:750; transition:transform .16s ease, background .22s ease, color .22s ease, box-shadow .22s ease; }
.nav button.active { background:linear-gradient(145deg,#4f587d,#324b55); color:white; box-shadow:0 6px 14px #0807134d; }
.card { background:linear-gradient(145deg,#282d44,#22283a); border:1px solid var(--edge); border-radius:19px; padding:17px; margin:12px 0; box-shadow:0 10px 24px #0b0f1a40; animation:softRise .24s ease both; }
.card.soft { background:rgba(39,40,61,.7); }
.sectionline { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:13px; }
h1,h2,h3,p { margin:0; }
h1 { font-size:24px; font-weight:900; letter-spacing:-.5px; }
h2 { font-size:20px; font-weight:850; letter-spacing:-.3px; }
h3 { font-size:15px; font-weight:850; }
.sub { color:var(--muted); font-size:13px; line-height:1.52; }
.pill { font-size:11px; font-weight:800; letter-spacing:.2px; color:#171724; background:var(--gold); padding:5px 8px; border-radius:999px; white-space:nowrap; }
.label { font-size:11px; text-transform:uppercase; letter-spacing:1.2px; font-weight:850; color:var(--muted); }
.btn { border:0; background:linear-gradient(135deg,#ffd77f,#ffae8e); color:#272033; border-radius:13px; min-height:44px; padding:11px 15px; font-size:14px; font-weight:900; box-shadow:0 5px 12px #11112370; transition:transform .15s ease, box-shadow .18s ease, filter .18s ease; }
.btn.alt { background:linear-gradient(135deg,#3f4361,#33424d); color:#f7f4ff; box-shadow:none; border:1px solid #5b6780; }
.btn.ghost { background:transparent; color:var(--muted); border:1px solid var(--edge); box-shadow:none; }
.btn.wide { width:100%; }
.btn.tiny { padding:8px 10px; min-height:34px; font-size:12px; border-radius:9px; }
.stack { display:flex; flex-direction:column; gap:9px; }
.row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.price { font-size:13px; color:var(--gold); font-weight:800; }
.select-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
.select-game { background:#2b2a43; border:2px solid #44435f; padding:15px 5px; min-height:128px; border-radius:15px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; transition:transform .16s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease; box-shadow:0 6px 14px #0c102033; }
.select-game.selected { border-color:var(--gold); background:#3b3450; transform:translateY(-1px); box-shadow:0 10px 20px #0b111c40; }
.select-game .em { font-size:34px; }
.select-game strong { font-size:13px; }
.select-game small { font-size:10px; color:var(--muted); }
.progress { width:100%; height:9px; background:#111421; border-radius:99px; overflow:hidden; margin:10px 0 7px; border:1px solid #313146; }
.progress > div { height:100%; background:linear-gradient(90deg,#8fc2ff,#8ef2dc,#ffd782); border-radius:99px; transition:width .25s ease; }
.callout { padding:10px 12px; background:#201f36; border-radius:11px; border:1px solid #42405a; color:#ddd9f5; font-size:12px; line-height:1.45; }
.callout.good { border-color:#4c927b; background:#1d3536; }
.callout.gold { border-color:#877047; background:#3b3331; }
.board-bingo { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; margin:12px 0; }
.bingo-head { background:#3a315a; border-radius:7px; font-weight:900; font-size:16px; text-align:center; padding:7px 2px; color:#e7d5ff; }
.bingo-cell { aspect-ratio:1; min-height:44px; border:1px solid #55536c; border-radius:9px; background:#383954; display:flex; justify-content:center; align-items:center; font-size:18px; font-weight:850; position:relative; }
.bingo-cell.hit { background:linear-gradient(145deg,#1e776f,#295d70); border-color:#64e2bf; }
.bingo-cell.hit::after { content:'✓'; position:absolute; font-weight:900; font-size:12px; right:3px; bottom:0; color:#baffeb; }
.bingo-cell.free { background:#846448; border-color:#fac57a; font-size:10px; }
.crossword-board { display:grid; grid-template-columns:repeat(11,minmax(0,1fr)); gap:2px; margin:14px auto; width:min(100%,390px); }
.crosscell { aspect-ratio:1; border-radius:3px; background:#37384d; border:1px solid #5c5b73; text-align:center; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:clamp(12px,3.3vw,17px); }
.crosscell.blank { background:transparent; border:0; }
.crosscell.hidden { color:#9292b0; }
.crosscell.found { background:#286958; color:#d9fff4; border-color:#5dd0a5; }
.match-board { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin:14px 0; }
.symbol { aspect-ratio:1; display:flex; justify-content:center; align-items:center; border-radius:10px; background:#313248; border:1px solid #4c506c; font-size:25px; }
.symbol.hidden { color:#565972; }
.symbol.new { border-color:var(--gold); background:#574348; }
.scratch-tray { position:relative; border:2px solid #c7b9c4; border-radius:14px; min-height:138px; overflow:hidden; margin:14px 0 9px; background:linear-gradient(145deg,#234a56,#3a2d51); box-shadow:inset 0 0 0 1px #ffffff12, 0 8px 18px #10162a33; }
.scratch-items { display:flex; justify-content:center; align-content:center; align-items:center; flex-wrap:wrap; gap:7px; min-height:138px; padding:15px; }
.scratch-item { background:#d6eee3; color:#262634; border-radius:9px; min-width:39px; min-height:39px; padding:6px; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:900; box-shadow:inset 0 -2px 0 #9cbab4; }
.scratch-item.symbol-item { font-size:25px; }
.scratch-tray canvas { touch-action:none; user-select:none; -webkit-user-select:none; display:block; position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; }
.ticket-top { background:linear-gradient(120deg,#5c4475,#556684); border:1px dashed #c8acd4; border-radius:12px; padding:13px; text-align:center; margin:11px 0; box-shadow:inset 0 0 0 1px #ffffff10; }
.ticket-top strong { display:block; text-transform:uppercase; letter-spacing:1.6px; font-size:15px; }
.ticket-top span { display:block; color:#e6dbf0; font-size:11px; margin-top:4px; }
.kpi-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; margin:10px 0 12px; }
.kpi { background:#202134; border-radius:10px; padding:10px 6px; text-align:center; }
.kpi strong { display:block; font-size:20px; }
.kpi small { display:block; color:var(--muted); font-size:10px; margin-top:3px; }
.finish { text-align:center; padding:18px 6px; }
.finish .em { font-size:50px; }
.finish h2 { margin:7px 0 5px; }
.big-amount { font-size:34px; font-weight:900; color:var(--gold); margin:10px 0; }
.collect-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:15px 0; }
.collect-item { min-height:90px; border:1px solid #4d4b68; border-radius:12px; display:flex; flex-direction:column; gap:5px; align-items:center; justify-content:center; text-align:center; background:#2e3048; padding:6px 3px; }
.collect-item.unknown { background:#212336; border-style:dashed; }
.collect-item .art { font-size:30px; }
.collect-item small { font-size:10px; color:#c7c8d5; line-height:1.15; }
.collect-item.unknown small { color:#666a87; }
.pack-art { font-size:55px; text-align:center; padding:15px; }
.pack-results { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; }
.pack-result { border-radius:13px; border:1px solid #6e647a; padding:15px 5px; text-align:center; background:linear-gradient(145deg,#38405e,#332c50); }
.pack-result .art { font-size:41px; margin-bottom:7px; }
.pack-result strong { display:block; font-size:13px; }
.pack-result small { display:block; margin-top:5px; font-size:11px; color:#d4bfdf; }
.notice { margin:12px 0; padding:11px 12px; border-radius:12px; font-size:12px; border:1px solid #7a765a; background:linear-gradient(135deg,#473f39,#3b3f35); color:#fff0cf; line-height:1.5; animation:softFade .28s ease both; }
.note { font-size:11px; line-height:1.5; color:var(--muted); }
.rule { height:1px; background:var(--edge); margin:15px 0; }
.bottom { margin-top:24px; padding-top:10px; font-size:11px; color:#8b8da3; text-align:center; line-height:1.5; }
@media (max-width:355px){.brand{font-size:21px}.select-game{min-height:112px}.bingo-cell{min-height:38px;font-size:16px}.collect-item{min-height:78px}.scratch-item{min-width:34px;min-height:34px}.card{padding:13px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Quiet, static visual treatment: no flashing, bounce, transitions, or confetti. */
:root { --bg:#16191e; --surface:#22282e; --surface2:#2a3137; --edge:#4b555c; --ink:#f2f1eb; --muted:#b5c0c3; --gold:#ddc89d; --pink:#ddc89d; --teal:#9ac3b8; --purple:#b9b8cf; --success:#a6d0b4; }
*,*::before,*::after {scroll-behavior:auto!important;}
body {background: radial-gradient(ellipse at 15% 0%,#343255 0%,transparent 44%),radial-gradient(ellipse at 100% 35%,#1d3e4a 0%,transparent 38%),var(--bg)!important;}
.stat {background:var(--surface);}
.nav {background:#242a30;}
.nav button.active {background:#39434b;box-shadow:none;}
.card {background:var(--surface);box-shadow:none;}
.card.soft {background:#20262c;}
.btn {background:#ddc89d;color:#262923;box-shadow:none;}
.btn.alt {background:#343e45;color:var(--ink);border:1px solid #59646a;}
.select-game {background:#293139;border-color:var(--edge);}
.select-game.selected {background:#343d44;border-color:var(--gold);}
.progress > div {background:#9ac3b8;}
.callout {background:#293139;border-color:var(--edge);color:var(--ink);}
.callout.good {background:#2c3a35;border-color:#627b6f;}
.callout.gold {background:#38362f;border-color:#766d55;}
.bingo-head {background:#3a424a;color:var(--ink);}
.bingo-cell {background:#2e363d;border-color:#536069;}
.bingo-cell.hit {background:#345d55;border-color:#81b6a3;}
.bingo-cell.free {background:#645844;border-color:#c5b18d;}
.crosscell {background:#343c43;border-color:#687178;}
.crosscell.found {background:#35584c;border-color:#77a994;color:#f1fbf5;}
.symbol {background:#2f383f;border-color:#58646b;}
.symbol.new {background:#484338;border-color:#aa9672;}
.scratch-tray {background:#2b343a;border-color:#8d999c;}
.scratch-item {background:#d4dfd9;box-shadow:none;}
.ticket-top {background:#353d44;border:1px dashed #7c8990;}
.ticket-top span {color:#d1d8d6;}
.kpi {background:#2a3238;}
.collect-item {background:#30393f;border-color:#59676d;}
.collect-item.unknown {background:#272f35;}
.pack-result {background:#303a42;border-color:#607078;}
.notice {background:#39362e;border-color:#756a56;color:#f6e9cc;}


/* Version 2: mobile-friendly scratcher cards */
:root { --accent:#ddc79d; }
#app {max-width:650px;}
.select-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
.select-game {min-height:119px;}
.bingo-six {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:14px 0;}
.mini-bingo {border:1px solid #5e696d;border-radius:12px;padding:7px;background:#283238;min-width:0;}
.mini-bingo-header {display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:7px;}
.mini-bingo-header strong {font-size:12px;}
.mini-bingo-header small {font-size:10px;color:var(--muted);}
.mini-bingo-grid {display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;}
.mini-bingo-cell {aspect-ratio:1; min-width:0;display:flex;align-items:center;justify-content:center;background:#3c464c;border:1px solid #68757a;border-radius:3px;font-size:clamp(10px,2.6vw,14px);font-weight:800;position:relative;}
.mini-bingo-cell.hit {background:#4b766d;color:#f0fff7;border-color:#9acaba;}
.mini-bingo-cell.hit:after {content:'•'; position:absolute; color:#e4f8f0; right:1px; bottom:-3px; font-size:14px;}
.mini-bingo-cell.free {background:#76674b;color:#fff4d4;border-color:#c0ad85;font-size:8px;}
.mini-bingo-letter {font-size:9px;color:#d7dfdf;text-align:center;font-weight:900;margin-bottom:2px;}
.mini-bingo-bonus {font-size:10px;color:#d4e3dc;text-align:center;margin-top:6px;}
.calls-card {background:#2a363b;border:1px solid #627078;border-radius:12px;padding:11px;margin:12px 0;}
.calls-grid {display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin:9px 0 5px;}
.called-number {height:34px;display:flex;align-items:center;justify-content:center;border:1px dashed #697780;border-radius:8px;background:#323d43;color:#667780;font-size:12px;font-weight:850;}
.called-number.revealed {border:1px solid #acb6b0;color:#f6f9f5;background:#52675e;}
.called-number.recent {background:#7a6650;color:#fff0ce;border-color:#d9bd89;}
.calls-grid.bonus {grid-template-columns:repeat(5,minmax(0,1fr));}
.called-number.bonus {border-color:#7e755f;}
.rule-small {font-size:11px;color:var(--muted);line-height:1.5;}
.prize-strip {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:11px 0;}
.prize-chip {background:#303940;border:1px solid #637077;border-radius:9px;padding:8px 4px;text-align:center;}
.prize-chip strong {display:block;font-size:13px;color:#e1ceaa;}
.prize-chip small {display:block;font-size:9px;color:#c3cecf;margin-top:4px;}
.crossword-sheet {display:grid;grid-template-columns:1fr;gap:10px;margin-top:13px;}
.crossword-paper {padding:9px;border:1px solid #617274;border-radius:11px;background:#29363a;min-width:0;}
.crossword-paper .row {margin-bottom:5px;}
.crossword-paper .row strong {font-size:13px;}
.crossword-board {display:grid;gap:1px;margin:8px auto 0;width:min(100%,420px);}
.crosscell {border-radius:1px;background:#3d4748;border:1px solid #677677;color:#dfe6e1;font-size:clamp(9px,2.5vw,16px);}
.crosscell.blank {background:transparent;border:0;}
.crosscell.called {color:#f9fffb;background:#587169;}
.crosscell.found {background:#ab9972;color:#17201b;border-color:#f3dfb4;}
.letter-bank {display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin:8px 0 10px;}
.letter-cell {height:36px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:#333d43;border:1px dashed #647178;color:#7e8d8e;font-weight:900;}
.letter-cell.called {background:#b6b3a0;color:#202a2c;border-style:solid;border-color:#ece1c3;}
.bonus-word {margin:12px 0;padding:11px;border:1px solid #716a53;border-radius:10px;background:#35382e;display:flex;justify-content:space-between;gap:7px;align-items:center;}
.bonus-word strong {letter-spacing:2px;font-size:15px;}
.bonus-word.done {background:#4e624e;}
.scratch-tray {border-color:#9a9f9b;background:#27373b;}
.scratch-tray.revealed {border-style:solid;}
.scratch-note {font-size:11px;text-align:center;color:var(--muted);margin-top:6px;}
.scratch-items {min-height:124px;}
.scratch-item {min-width:36px;min-height:36px;}
@media(max-width:370px){.mini-bingo {padding:5px;}.mini-bingo-cell {font-size:10px;}.calls-grid {gap:2px;}.called-number {height:31px;}.letter-cell {height:30px;}.prize-strip {gap:4px;}}
@media(prefers-reduced-motion: reduce){*,*:before,*:after{animation:none!important;transition:none!important;}}
/* V3: restore the clearer, softly colorful V1 scratch-panel appearance. */
.scratch-tray {border:2px solid #b7abb8; background:linear-gradient(145deg,#1c3a4b,#302844); min-height:138px;}
.scratch-items {min-height:138px;}
.scratch-item {background:#d6eee3; color:#262634; min-width:39px; min-height:39px; box-shadow:inset 0 -2px 0 #9cbab4;}

/* V3 Collections Edition: six genuinely distinct static display styles. */
.collection-shell {--collection-accent:#d7bb83;--collection-muted:#776b52;}
.collection-shell.kind-stickers {--collection-accent:#a4d4ad;--collection-muted:#536c5a;}
.collection-shell.kind-museum {--collection-accent:#c9b997;--collection-muted:#6d6251;}
.collection-shell.kind-medals {--collection-accent:#e1bb79;--collection-muted:#7c6241;}
.collection-shell.kind-postcards {--collection-accent:#b0c9de;--collection-muted:#526e83;}
.collection-shell.kind-patches {--collection-accent:#c5aed8;--collection-muted:#695575;}
.collection-hero {border:1px solid var(--collection-muted);border-radius:17px;overflow:hidden;background:#242d32;margin-bottom:14px;}
.collection-hero-art {min-height:125px;position:relative;display:flex;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 70% 20%,#ffffff11,transparent 45%),linear-gradient(145deg,#414845,#283338);border-bottom:1px solid #ffffff20;}
.kind-cards .collection-hero-art {background:linear-gradient(140deg,#554935,#32312e);}
.kind-stickers .collection-hero-art {background:linear-gradient(140deg,#405a4c,#273c39);}
.kind-museum .collection-hero-art {background:repeating-linear-gradient(90deg,#3d3830 0 22px,#403b33 23px 44px);}
.kind-medals .collection-hero-art {background:linear-gradient(140deg,#504433,#2f3334);}
.kind-postcards .collection-hero-art {background:linear-gradient(145deg,#334b5b,#29363b);}
.kind-patches .collection-hero-art {background:repeating-linear-gradient(40deg,#414050 0 3px,#444251 3px 6px);}
.hero-sample.mystery {color:#c8c2ae;border-style:dashed;font-size:30px;}
.hero-sample {width:65px;height:75px;border-radius:9px;border:2px solid #ffffff50;background:#ffffff12;display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 5px 12px #0002;}
.kind-cards .hero-sample:first-child {transform:rotate(-8deg);}
.kind-cards .hero-sample:last-child {transform:rotate(8deg);}
.kind-stickers .hero-sample {height:65px;border:3px solid #e1e7d8;border-radius:18px;transform:rotate(-5deg);}
.kind-stickers .hero-sample:nth-child(2) {transform:rotate(6deg);}
.kind-museum .hero-sample {height:72px;border:1px solid #9d9483;border-bottom:7px solid #c0aa7d;border-radius:5px;}
.kind-medals .hero-sample {width:65px;height:65px;border-radius:50%;border:5px double #cbb37a;}
.kind-postcards .hero-sample {width:82px;height:65px;border:4px solid #d3dcd9;border-radius:3px;transform:rotate(-4deg);}
.kind-patches .hero-sample {border:2px dashed #d0c4d7;border-radius:22px;}

.kind-museum .artifact.unknown {background:#38342d;border-style:dashed;}
.kind-medals .artifact {border:0;background:transparent;min-height:116px;}

.kind-medals .artifact.unknown .art {border-color:#687578;border-style:dashed;background:#30383a;box-shadow:none;}
.kind-postcards .artifact-grid {grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:#334450;}
.kind-postcards .artifact {min-height:125px;border:5px solid #d6d7c9;border-radius:4px;background:linear-gradient(155deg,#657f88,#364d60);}

.kind-postcards .artifact .art {font-size:37px;height:58px;}
.kind-postcards .artifact .name {font-size:12px;color:#fff9ed;background:#172d3478;padding:3px 7px;max-width:100%;}

.kind-postcards .artifact.unknown {background:#354751;border-color:#849196;}
.kind-patches .collection-page {background:repeating-linear-gradient(45deg,#3e4050,#3e4050 4px,#3c3e4c 4px,#3c3e4c 8px);border-color:#706b79;}

.pack-vault-hero {display:flex;align-items:center;gap:15px;padding:12px 13px;border:1px solid #65736d;background:#293436;border-radius:13px;margin:10px 0 15px;}
.sealed-pack {position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;flex:0 0 88px;height:104px;border:2px solid #d8c595;border-radius:9px;background:linear-gradient(155deg,#53625c,#363b41);box-shadow:inset 0 0 0 4px #d8c59522;}
.sealed-pack:before,.sealed-pack:after {content:'';height:7px;left:4px;right:4px;position:absolute;border-top:1px dashed #decbad66;border-bottom:1px dashed #decbad66;}
.sealed-pack:before {top:3px}.sealed-pack:after {bottom:3px}
.sealed-pack .seal-icon {font-size:36px}.sealed-pack small {color:#efe3c5;font-size:9px;font-weight:850;letter-spacing:1px;}
.pack-vault-copy strong {font-size:16px;display:block}.pack-vault-copy small {display:block;font-size:12px;line-height:1.45;color:var(--muted);margin-top:6px;}
.reveal-artifacts {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0;}
.reveal-artifact {text-align:center;border:1px solid #7a817d;border-radius:12px;padding:12px 8px;background:#35403f;}
.reveal-artifact .reveal-emblem {font-size:39px;min-height:50px;display:flex;align-items:center;justify-content:center;}
.reveal-artifact .discovery-flag {font-size:10px;display:inline-block;padding:4px 7px;border-radius:999px;margin:7px 0;color:#eee9d7;background:#4d6557;border:1px solid #729b83;font-weight:900;letter-spacing:.5px;}
.reveal-artifact.is-duplicate .discovery-flag {background:#55504b;border-color:#85796b;}
.reveal-artifact strong {display:block;font-size:12px}.reveal-artifact small {display:block;color:var(--muted);font-size:10px;margin-top:5px;}
.duplicate-pouch {background:#293338;border:1px solid #56656b;border-radius:12px;padding:12px;margin:16px 0;}
.duplicate-head {display:flex;align-items:center;justify-content:space-between;gap:10px;}
.duplicate-tray {display:flex;gap:8px;margin:12px 0;}
.duplicate-slot {width:56px;height:72px;border:1px dashed #77827e;border-radius:7px;background:#1f282d;display:flex;align-items:center;justify-content:center;font-size:26px;color:#69777a;}
.duplicate-slot.filled {border:1px solid #bea985;background:linear-gradient(145deg,#545149,#353b3b);color:#e3d3af;}
.duplicate-foot {display:flex;align-items:center;justify-content:space-between;gap:10px;}
.gallery-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px;}
.gallery-tile {text-align:left;padding:0;border:1px solid #66716c;border-radius:12px;background:#293339;overflow:hidden;}
.gallery-tile .gallery-art {height:76px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:26px;background:linear-gradient(135deg,#4a554d,#343f42);}
.gallery-tile.kind-stickers .gallery-art {background:#435b4b;}
.gallery-tile.kind-museum .gallery-art {background:#514b3e;}
.gallery-tile.kind-medals .gallery-art {background:#5c503d;}
.gallery-tile.kind-postcards .gallery-art {background:#435c6c;}
.gallery-tile.kind-patches .gallery-art {background:#575269;}
.gallery-tile .gallery-text {padding:10px;}
.gallery-tile .gallery-text strong {display:block;font-size:12px;line-height:1.3;}
.gallery-tile .gallery-text small {display:block;font-size:10px;color:var(--muted);margin-top:5px;}
.gallery-tile .gallery-text em {font-style:normal;font-size:10px;color:#b7e2c7;font-weight:850;}
.gallery-head {display:flex;justify-content:space-between;align-items:center;gap:10px;}
.archive-tag {border:1px solid #718773;color:#c5e3c9;padding:4px 7px;border-radius:8px;font-size:10px;font-weight:850;}

.btn:hover,.btn.alt:hover,.btn.ghost:hover,.select-game:hover,.gallery-tile:hover,.artifact:hover,.pack-result:hover{filter:brightness(1.03);}
.btn:active,.nav button:active,.select-game:active,.gallery-tile:active,.artifact:active,.pack-result:active{transform:translateY(1px) scale(.985);}
.reveal-artifact,.pack-result,.gallery-tile,.sealed-pack,.duplicate-pouch{animation:softRise .26s ease both;}
.select-grid .select-game:first-child{background:linear-gradient(145deg,#2b3d49,#293b4a);border-color:#4d6872;}
.select-grid .select-game:first-child.selected{background:linear-gradient(145deg,#2c5556,#355273);border-color:#9de9d7;}
.select-grid .select-game:last-child{background:linear-gradient(145deg,#44324e,#4c3d36);border-color:#6d5a64;}
.select-grid .select-game:last-child.selected{background:linear-gradient(145deg,#5d4567,#6b5a34);border-color:#ffd782;}
.kpi{transition:transform .16s ease, background .2s ease;border:1px solid #384056;background:linear-gradient(145deg,#23273b,#1d2234);}
.kpi:hover{transform:translateY(-1px);}
.collect-item,.artifact,.gallery-tile,.pack-result{transition:transform .18s ease, box-shadow .22s ease, border-color .22s ease, background .22s ease;}
.collect-item:hover,.artifact:hover,.gallery-tile:hover,.pack-result:hover{box-shadow:0 8px 16px #0d111d2a;}
@keyframes softRise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes softFade{from{opacity:0}to{opacity:1}}
@media(max-width:370px){.artifact-grid{gap:5px;padding:7px}.artifact{min-height:102px}.artifact .art{width:47px;height:50px;font-size:27px}.artifact .name{font-size:9px}.gallery-grid{gap:8px}}


/* V3.2 — screen-fitting, directly scratchable ticket view */
#app.playing {height:100dvh;max-width:660px;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding: max(5px,env(safe-area-inset-top)) 10px max(6px,env(safe-area-inset-bottom));}
.playing .topbar {padding:0;min-height:30px;flex-shrink:0;}
.playing .topbar .kicker {display:none;}
.playing .brand {font-size:18px;letter-spacing:-.5px;}
.playing .demo {font-size:9px;padding:4px 7px;}
.playing .wallet {margin:4px 0;gap:6px;flex-shrink:0;}
.playing .stat {padding:4px 10px;border-radius:9px;box-shadow:none;animation:none;display:flex;align-items:baseline;gap:5px;white-space:nowrap;}
.playing .stat small {font-size:10px;margin:0;flex-shrink:0;}
.playing .stat strong {font-size:16px;}

.playing .nav {margin:3px 0 4px;padding:2px;gap:2px;flex-shrink:0;border-radius:10px;box-shadow:none;}

.live-play {display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;}

.live-play-head strong {font-size:14px;letter-spacing:.2px;}
.live-play-head small {font-size:11px;color:var(--muted);}

.game-viewport {min-height:0;min-width:0;flex:1;overflow:hidden;overscroll-behavior:contain;border:1px solid #536073;border-radius:13px;background:linear-gradient(145deg,#28314a,#222d3d);touch-action:pan-x pan-y;}
.game-scaler {position:relative;transform-origin:top left;}

.stage-calls {display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;}
.stage-calls.bonus {grid-template-columns:repeat(5,minmax(0,1fr));margin-top:4px;}
.token-field {height:26px;position:relative;display:flex;align-items:center;justify-content:center;background:#34434c;color:#90a0a7;border:1px solid #6c7d85;border-radius:5px;font-weight:900;font-size:12px;overflow:hidden;}

.token-field.bonus {background:#4a414b;border-color:#8a7a84;}
.token-field.bonus.seen {background:#e1c596;color:#3b2d28;}

.token-field .token-text {pointer-events:none;}
.stage-bingo-six {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;}
.stage-bingo-card {padding:5px;background:#233744;border:1px solid #6e8893;border-radius:7px;min-width:0;}
.stage-bingo-card:nth-child(2n) {background:#333450;border-color:#7a7793;}

.stage-bingo-grid {display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;}

.stage-bingo-cell.free {font-size:9px;background:#a88656;color:#fff5e2;border-color:#dbb97c;}
.stage-bingo-prize {font-size:9px;color:#d5e5e1;text-align:center;margin-top:3px;}

.stage-letter-grid .token-field.seen {background:#e1c89b;color:#362b37;border-color:#ffe4b9;}

.stage-guide {font-size:9px;color:#b7c9d2;text-align:center;margin-top:5px;}

/* V3.5.4: keep WebKit scroll anchoring away from removable scratch canvases. */
.game-viewport,.game-scaler,.game-stage,.token-field,.board-foil,.token-foil {overflow-anchor:none;}

/* V3.5.2: one-finger pan on the card background; Pan mode makes every spot draggable. */
.game-viewport {touch-action:none!important;}
.gesture-hint {display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px;margin:0 0 4px;}

.pan-toggle:focus-visible {outline:2px solid var(--gold);outline-offset:2px;}
.game-viewport.pan-active {cursor:grab;}
.game-viewport.pan-active:active {cursor:grabbing;}

/* V3.4: no match hints whatsoever. The board looks identical until YOU scratch a called value. */
.stage-bingo-cell.ready,.stage-cross-grid .crosscell.ready,.stage-cross-bonus .bonus-char.ready {
  background:inherit; border-color:inherit; color:inherit;
}
.stage-bingo-cell.ready{background:#304759!important;border-color:#7e9aaa!important;color:#fff9ed!important;}
.stage-cross-grid .crosscell.ready{background:#3b4d63!important;color:#f7fcf9!important;border-color:#8196a6!important;}
.stage-cross-bonus .bonus-char.ready{background:transparent!important;color:#f2dbab!important;}

<body><div id="app"><div class="card"><h2>Step Scratchers</h2><p class="sub" style="margin-top:12px">This file preview cannot run the game. Open the published website in Chrome to play.</p></div></div>
<script>
(()=>{
'use strict';
const KEY='step-scratchers-prototype-v1';
const RATE=547, COINS_PER_RATE=10, TICKET_COST=30, ROUND_COST=10, PACK_COST=50;
const TYPES={bingo:{label:'Bingo',icon:'🔢'},crossword:{label:'Crossword',icon:'🔠'}};
const PROJECTS=[
 {title:'The Curiosity Cabinet',kind:'Card Album',icon:'🃏',items:[['🔑','Golden Key'],['🦋','Moon Moth'],['🧭','Compass'],['🔮','Crystal Ball'],['⏳','Hourglass'],['🪞','Magic Mirror'],['💎','Sapphire'],['👑','Tiny Crown'],['🗝️','Silver Key'],['📜','Lost Letter'],['🕯️','Old Candle'],['🪙','Lucky Coin']]},
 {title:'The Enchanted Garden',kind:'Sticker Book',icon:'🌿',items:[['🌸','Pink Bloom'],['🍄','Little Toadstool'],['🐝','Bumblebee'],['🌻','Sunflower'],['🪻','Lavender'],['🌺','Hibiscus'],['🌱','Seedling'],['🍀','Four-Leaf Clover'],['🌷','Tulip'],['🌿','Fern'],['🦗','Cricket'],['🪷','Water Lily']]},
 {title:'The Mini Museum',kind:'Exhibit Cases',icon:'🏛️',items:[['🐚','Sea Shell'],['🦴','Fossil'],['🪨','Meteorite'],['🦕','Dinosaur'],['💠','Opal'],['🗿','Ancient Idol'],['🏺','Clay Vase'],['🪶','Ancient Quill'],['⚱️','Golden Urn'],['🛡️','Old Shield'],['📿','Antique Beads'],['🧱','Rune Tablet']]},
 {title:'The Medal Vault',kind:'Medal Display',icon:'🏅',items:[['🥉','Bronze Star'],['🥈','Silver Dawn'],['🥇','Golden Sun'],['🎖️','Explorer'],['🏵️','Bloom'],['🌙','Moonlight'],['⭐','Bright Star'],['⚜️','Flourish'],['💫','Comet'],['☀️','Daybreak'],['🏆','Champion'],['🎗️','Ribbon']]},
 {title:'The Postcard Gallery',kind:'Postcard Book',icon:'🗺️',items:[['🏔️','Mountains'],['🏖️','Seaside'],['🌉','Bridge'],['🌆','Cityscape'],['🏜️','Desert'],['🌲','Forest'],['🗽','Landmark'],['🚂','Train'],['⛵','Sailboat'],['🌋','Volcano'],['🏰','Castle'],['🌌','Night Sky']]},
 {title:'The Patch Collection',kind:'Patch Board',icon:'🧵',items:[['🚀','Rocket'],['🪐','Planet'],['🧋','Bubble Tea'],['🎸','Guitar'],['🎈','Balloon'],['🎨','Paintbrush'],['🎧','Headphones'],['🛼','Skates'],['🎯','Target'],['🪁','Kite'],['🧲','Magnet'],['🪩','Disco Ball']]}
];
const WORDS=['TREASURE','SPARK','LUCK','BONUS','COIN','GOLD','CARD','STAR','KEY','GEM','CROWN','PEARL','WALK','PRIZE','WIN','TICKET','GARDEN','SECRET','LUCKY','MYSTERY','DAWN','OCEAN','CLOUD','LIGHT','FLOWER','SHINE','DREAM','SMILE','SILVER','BRIGHT','RIBBON','HEART','GIFT','PEACE','STONE','SHELL','APE','SEA','RUN','HAT','TREE','NOTE','RING','TALL','WEAR','DICE','BIRD','TIDE','OIL','ICE','SAND','JAM','MAP','TEN','CAT','BLUE','FIVE','TWO','NEW','OWL','MOON','RAIN','TOY','BELL','FAN','GLOW','NEST','HOME','RIVER','ROSE','WIND','ECHO','NICE','FIRE','TINY','GLOW','READ','LAMP'];
let view='scratch',selected='bingo',notice='',archiveOpen=null,zoomFactor=1,panMode=false,S=load(),healthPreview=null,healthSyncMessage='';
function initial(){return {version:1,bank:6000,coins:0,freeRounds:0,freeTickets:0,ticket:null,projectIndex:0,owned:[],duplicates:0,packs:0,packResults:null,completed:[],stats:{tickets:0,rounds:0,walkCoins:0,winCoins:0,projects:0},history:[]}}
function freshRealGame(){const start=initial();start.bank=0;start.liveMode=true;start.healthDays={};start.lastHealthDay=null;start.lastHealthTotal=0;start.rulesVersion=2;return start;}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.version===1&&Number.isFinite(x.bank)&&Number.isFinite(x.coins))return x;}catch(e){}return initial()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

// Apple Health is read by an iPhone Shortcut, never by this website directly.
// The Shortcut opens the app with #sssteps=<today-total>. URL fragments stay
// client-side; GitHub Pages never receives them as part of the HTTP request.
function localDay(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function acceptHealthTotal(total,day){
 if(!S.liveMode)return false;
 if(!S.healthDays||typeof S.healthDays!=='object')S.healthDays={};
 const previous=Math.max(0,Math.trunc(Number(S.healthDays[day])||0));
 const delta=Math.max(0,total-previous);
 if(delta)S.bank+=delta;
 S.healthDays[day]=Math.max(total,previous);
 S.lastHealthDay=day;S.lastHealthTotal=total;
 const dates=Object.keys(S.healthDays).sort();if(dates.length>90)for(const old of dates.slice(0,-90))delete S.healthDays[old];
 healthSyncMessage=delta?`Added ${delta.toLocaleString()} new steps from Apple Health.`:'Already up to date — no steps counted twice.';
 save();return true;
}
function checkHealthLink(){
 const hash=window.location.hash||'';
 const match=/^#sssteps=([0-9,]{1,11})$/.exec(hash);
 if(!match)return;
 // Remove count from visible address and browser history immediately.
 try{history.replaceState(null,'',window.location.pathname+window.location.search);}catch(e){}
 const count=Number(match[1].replaceAll(',',''));
 if(!Number.isSafeInteger(count)||count<0||count>150000)return;
 const day=localDay();
 if(S.liveMode){acceptHealthTotal(count,day);view='wallet';}
 else{healthPreview={count,day};view='wallet';}
}
function healthSyncHtml(){
 const preview=healthPreview;
 const live=!!S.liveMode;
 const title=live?'Apple Health step syncing':'Connect your Apple Watch steps';
 let h=`<div class="card health-connect"><div class="health-kicker">⌚ Apple Health · local step sync</div><h2>${title}</h2>`;
 if(live){
  h+=`<p class="sub" style="margin-top:8px">Use your Step Scratchers Sync shortcut whenever you want to update your real steps. You can run it more than once a day without double counting.</p>`;
  h+=`<div class="health-summary"><div class="health-figure"><strong>${Number(S.lastHealthTotal||0).toLocaleString()}</strong><small>Last Health total today${S.lastHealthDay===localDay()?'':'/on last sync day'}</small></div><div class="health-figure"><strong>${S.lastHealthDay===localDay()?localDay():'—'}</strong><small>${S.lastHealthDay===localDay()?'Last synced day':'Open the Shortcut to sync today'}</small></div></div>`;
  if(healthSyncMessage)h+=`<div class="health-sync-status" role="status">${esc(healthSyncMessage)}</div>`;
 }else if(preview){
  h+=`<p class="sub" style="margin-top:8px">The Shortcut supplied <strong>${preview.count.toLocaleString()} steps</strong> for today. Check that this matches Apple Health before enabling.</p>`;
  h+=`<div class="callout gold" style="margin:12px 0">Start completely fresh: all demo steps, coins, tickets, free rounds, packs, collections, and statistics will be erased. The new bank will contain <strong>only today's real Apple Health steps</strong> plus steps from future syncs. You can earn coins from these real steps.</div>`;
  h+=`<button class="btn wide" data-act="activateHealth">Start tracking real steps</button><button style="margin-top:9px" class="btn ghost wide" data-act="dismissHealth">Not yet — continue demo</button>`;
 }else{
  h+=`<p class="sub" style="margin-top:8px">Once you create the free iPhone Shortcut, it will send today's step total directly to this browser. Only steps are read; no heart-rate data or GPS. No login required.</p><div class="callout" style="margin-top:12px">First, run the Shortcut and compare its number with the Steps total in Apple Health. You'll choose when to replace the pretend step bank.</div>`;
 }
 return h+'</div>';
}

function rand(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function project(){return PROJECTS[S.projectIndex%PROJECTS.length]}
function projectTitle(){let n=Math.floor(S.projectIndex/PROJECTS.length)+1;return project().title+(n>1?` · Volume ${n}`:'')}
function gridNumbers(){const nums=[];for(let c=0;c<5;c++){let block=shuffle(Array.from({length:15},(_,i)=>i+c*15+1)).slice(0,5);for(let r=0;r<5;r++)nums[r*5+c]=block[r]};nums[12]=null;return nums}
function makeBingo(){return {cards:Array.from({length:6},gridNumbers),source:shuffle(Array.from({length:75},(_,i)=>i+1)).slice(0,29)}}
function makeBoard(n, base, maxWords){
 const grid=Array.from({length:n},()=>Array(n).fill(''));const entries=[];
 const r=Math.floor(n/2),c=Math.floor((n-base.length)/2);
 for(let i=0;i<base.length;i++)grid[r][c+i]=base[i];entries.push({word:base,r,c,dir:'across'});
 for(let word of shuffle(WORDS.filter(w=>w!==base && w.length<n-1)).slice(0,32)){
  const possible=[];
  for(let k=0;k<word.length;k++)for(let rr=0;rr<n;rr++)for(let cc=0;cc<n;cc++){
   if(grid[rr][cc]!==word[k])continue;
   for(let dir of ['down','across']){
    const dr=dir==='down'?1:0,dc=dir==='across'?1:0,sr=rr-k*dr,sc=cc-k*dc;
    if(sr<0||sc<0||sr+(word.length-1)*dr>=n||sc+(word.length-1)*dc>=n)continue;
    if(sr-dr>=0&&sc-dc>=0&&grid[sr-dr][sc-dc])continue;
    const er=sr+word.length*dr,ec=sc+word.length*dc;
    if(er<n&&ec<n&&grid[er][ec])continue;
    let crosses=0,valid=true;
    for(let i=0;i<word.length;i++){
     let y=sr+i*dr,x=sc+i*dc;
     if(grid[y][x]&&grid[y][x]!==word[i]){valid=false;break}
     if(grid[y][x]){crosses++;continue}
     for(let [ny,nx] of (dir==='down'?[[y,x-1],[y,x+1]]:[[y-1,x],[y+1,x]]))if(ny>=0&&ny<n&&nx>=0&&nx<n&&grid[ny][nx])valid=false;
     if(!valid)break;
    }
    if(valid&&crosses===1)possible.push({r:sr,c:sc,dir});
   }
  }
  if(!possible.length)continue;
  const p=possible[rand(possible.length)],dr=p.dir==='down'?1:0,dc=p.dir==='across'?1:0;
  for(let i=0;i<word.length;i++)grid[p.r+i*dr][p.c+i*dc]=word[i];
  entries.push({word,r:p.r,c:p.c,dir:p.dir});if(entries.length>=maxWords)break;
 }
 return {grid,words:entries};
}
function makeCrossword(){return {boards:[makeBoard(13,'TREASURE',11),makeBoard(9,'WALK',6)],bonusWord:['LUCKY','PRIZE','GOLD','SMILE','BONUS','HEART'][rand(6)],source:shuffle('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')).slice(0,20)}}
function makeTicket(type){return {id:Date.now(),type,round:0,pending:null,lastReveal:null,revealed:[],marks:[],data:type==='bingo'?makeBingo():makeCrossword(),finished:false,prize:0,bonus:[],freeRoundsSpent:0}}
function bingoOutcomes(t){let counts={lines:0,corners:0,xs:0,prize:0};let marks=new Set(t.marks||[]);
 t.data.cards.forEach((cells,ci)=>{
  const hit=i=>i===12||marks.has(markKeyB(ci,i));
  const lineSets=[];for(let r=0;r<5;r++)lineSets.push([0,1,2,3,4].map(c=>r*5+c));for(let c=0;c<5;c++)lineSets.push([0,1,2,3,4].map(r=>r*5+c));
  const lines=lineSets.filter(l=>l.every(hit)).length;
  const corners=[0,4,20,24].every(hit)?1:0;
  const x=[0,6,12,18,24,4,8,16,20].every(hit)?1:0;
  counts.lines+=lines;counts.corners+=corners;counts.xs+=x;
  counts.prize+=lines*(5+ci*3)+corners*25+x*60;
 });counts.prize=Math.min(120,counts.prize);return counts;
}
function completedWords(board,seen){return board.words.filter(w=>[...w.word].every(l=>seen.has(l)))}
function crossOutcomes(t){
 const g1=manualCompletedWords(t.data.boards[0],t,0).length,g2=manualCompletedWords(t.data.boards[1],t,1).length;
 const marks=new Set(t.marks||[]),bonus=Array.from(t.data.bonusWord).every((_,i)=>marks.has(markKeyBonus(i)));
 const game1Prize=g1>=9?80:g1>=7?45:g1>=5?18:g1>=3?8:0;
 const game2Prize=g2>=5?30:g2>=4?18:g2>=3?8:g2>=2?3:0;
 return {g1,g2,total:g1+g2,bonus,game1Prize,game2Prize,prize:Math.min(120,game1Prize+game2Prize+(bonus?8:0))};
}
function getPrize(t){return t.type==='bingo'?bingoOutcomes(t).prize:crossOutcomes(t).prize}
function ticketProgress(t){if(t.type==='bingo'){let o=bingoOutcomes(t);return `${o.lines} line${o.lines===1?'':'s'} · ${o.corners} four-corner bonus${o.corners===1?'':'es'}${o.xs?' · X bonus!':''}`;}let o=crossOutcomes(t);return `Game 1: ${o.g1} words · Game 2: ${o.g2} words${o.bonus?' · bonus word!':''}`}
function migrate(){if(S.rulesVersion>=2)return;
 if(S.ticket&&S.ticket.finished&&(!TYPES[S.ticket.type]||(S.ticket.type==='bingo'&&!S.ticket.data.cards)||(S.ticket.type==='crossword'&&!S.ticket.data.boards))){S.ticket=null;notice='Older finished ticket is preserved in your statistics. New two-game tickets are ready.';}
 if(S.ticket&&!S.ticket.finished&&(!TYPES[S.ticket.type]|| (S.ticket.type==='bingo'&&!S.ticket.data.cards)||(S.ticket.type==='crossword'&&!S.ticket.data.boards))){
  const t=S.ticket;S.coins+=TICKET_COST+ROUND_COST*(t.round+(t.pending?1:0));S.history.unshift({type:t.type,prize:0,when:new Date().toISOString(),retired:true});S.ticket=null;notice='Classic ticket converted to the new format. Its ticket and round costs were returned to your coin wallet. Your steps, coins and collection were kept.';
 }
 S.rulesVersion=2;save();
}
migrate();

// Backward-compatible manual marks: prior auto-highlighted results remain completed.
function markKeyB(ci,i){return `b:${ci}:${i}`;}
function markKeyC(bi,r,c){return `c:${bi}:${r}:${c}`;}
function markKeyBonus(i){return `x:${i}`;}
function ensureMarks(t){
 if(!t||t.type!=='bingo'&&t.type!=='crossword')return;
 if(!Array.isArray(t.marks)){
  const old=new Set(t.revealed||[]),marks=[];
  if(t.type==='bingo')t.data.cards.forEach((card,ci)=>card.forEach((n,i)=>{if(i!==12&&old.has(n))marks.push(markKeyB(ci,i))}));
  else {
   t.data.boards.forEach((board,bi)=>board.grid.forEach((row,r)=>row.forEach((l,c)=>{if(l&&old.has(l))marks.push(markKeyC(bi,r,c))})));
   Array.from(t.data.bonusWord).forEach((l,i)=>{if(old.has(l))marks.push(markKeyBonus(i))});
  }
  t.marks=marks;save();
 }
}
ensureMarks(S.ticket);
function expectedMarkKeys(t){
 if(!t)return [];
 const seen=new Set(activeSeen(t)),list=[];
 if(t.type==='bingo')t.data.cards.forEach((card,ci)=>card.forEach((n,i)=>{if(i!==12&&seen.has(n))list.push(markKeyB(ci,i))}));
 else {
  t.data.boards.forEach((board,bi)=>board.grid.forEach((row,r)=>row.forEach((l,c)=>{if(l&&seen.has(l))list.push(markKeyC(bi,r,c))})));
  Array.from(t.data.bonusWord).forEach((l,i)=>{if(seen.has(l))list.push(markKeyBonus(i))});
 }
 return list;
}
function markCount(t){const expected=expectedMarkKeys(t),mark=new Set(t?.marks||[]);return {total:expected.length,done:expected.filter(k=>mark.has(k)).length,remaining:expected.filter(k=>!mark.has(k)).length};}
function manualCompletedWords(board,t,bi){const marks=new Set(t.marks||[]);return board.words.filter(w=>[...w.word].every((_,i)=>marks.has(markKeyC(bi,w.r+(w.dir==='down'?i:0),w.c+(w.dir==='across'?i:0)))))}
// V3.5.3: Update the play controls without rebuilding scratch canvases or moving the ticket.
// A full render on the last call used to reset the viewport, and also discarded
// partially erased foil on other numbers. Keep the game-stage DOM mounted instead.
function refreshPlayState(t){
 const counter=document.getElementById('calledCounter');
 if(counter)counter.textContent=`${activeSeen(t).length} / ${t.type==='bingo'?29:20}`;
 const badge=document.querySelector('.live-play-head .pill');
 if(badge)badge.textContent=`Round ${t.round+(t.pending?1:0)} / 5`;
 const left=markCount(t).remaining;
 const status=document.getElementById('playStatus');
 if(status)status.textContent=t.pending
  ?`Scratch new ${t.type==='bingo'?'caller numbers':'letters'} · ${(t.pendingShown||[]).length} of ${t.pending.length} revealed`
  :left?`Find and scratch ${left} matching space${left===1?'':'s'} to continue`
  :t.round>=5?'All matches found! Finishing ticket…':'All matches found! Next round is ready.';
 const controls=document.querySelector('.live-play-commands');
 if(controls){
  controls.innerHTML=t.pending
   ?'<button class="btn ghost" data-act="finishScratch">Reveal caller numbers / letters</button>'
   :left?`<button class="btn" disabled>${left} matching spaces left</button>`
   :t.round>=5?'<button class="btn" disabled>Finishing ticket…</button>'
   :`<button class="btn" data-act="buyRound" ${S.coins<ROUND_COST&&S.freeRounds===0?'disabled':''}>${S.freeRounds>0?'Use free round':'Scratch next round · 10 coins'}</button>`;
  controls.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click',()=>handle(el.dataset.act,el.dataset.arg)));
 }
 // Reflect the player's marks in line/word counts without hinting at unmatched spaces.
 if(t.type==='bingo'){
  document.querySelectorAll('.stage-bingo-card').forEach((el,ci)=>{
   const card=t.data.cards[ci],marks=new Set(t.marks||[]);
   const hit=i=>i===12||marks.has(markKeyB(ci,i));let lines=0;
   for(let r=0;r<5;r++)if([0,1,2,3,4].every(c=>hit(r*5+c)))lines++;
   for(let c=0;c<5;c++)if([0,1,2,3,4].every(r=>hit(r*5+c)))lines++;
   const small=el.querySelector('.stage-bingo-header small');if(small)small.textContent=`${lines} line${lines===1?'':'s'}`;
  });
 }else{
  document.querySelectorAll('.stage-cross-paper').forEach((el,bi)=>{
   const done=manualCompletedWords(t.data.boards[bi],t,bi);
   const title=el.querySelector('strong');if(title)title.textContent=`GAME ${bi+1} · ${done.length} WORDS`;
   const found=new Set();
   for(const w of done)for(let k=0;k<w.word.length;k++)found.add(`${w.r+(w.dir==='down'?k:0)},${w.c+(w.dir==='across'?k:0)}`);
   const board=t.data.boards[bi];let idx=0;
   for(let r=0;r<board.grid.length;r++)for(let c=0;c<board.grid[r].length;c++,idx++){
    if(found.has(`${r},${c}`))el.querySelectorAll('.crosscell')[idx]?.classList.add('found');
   }
  });
  const bonusDone=Array.from(t.data.bonusWord).every((_,i)=>(t.marks||[]).includes(markKeyBonus(i)));
  const bonusLabel=document.querySelector('.stage-cross-bonus small');if(bonusLabel)bonusLabel.textContent=bonusDone?'BONUS COMPLETE!':'SCRATCH MATCHES · +8 COINS';
 }
}
function settleTicket(){
 const t=S.ticket;if(!t||t.finished||t.round<5||t.pending||markCount(t).remaining)return;
 t.finished=true;t.prize=getPrize(t);S.coins+=t.prize;S.stats.winCoins+=t.prize;
 if(Math.random()<.12){S.packs++;t.bonus.push('Mystery pack')}
 if(Math.random()<.025){S.freeTickets++;t.bonus.push('Free ticket')}
 S.history.unshift({type:t.type,prize:t.prize,when:new Date().toISOString()});S.history=S.history.slice(0,20);
 notice=t.prize?`Ticket complete! You won ${t.prize} virtual coins.`:'Ticket complete! No coin prize this time.';
 save();
 // Do not automatically replace the ticket screen at final completion.
 // The player can choose to leave the completed ticket and view results.
 const vp=document.getElementById('gameViewport');

function setupBoardScratch(){

  if(canvas.dataset.scratchReady==='1')continue;
  canvas.dataset.scratchReady='1';
  const key=canvas.dataset.mark,label=canvas.dataset.markLabel||'';
  const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(3,window.devicePixelRatio||1);
  if(w<8||h<8)continue;
  canvas.width=Math.max(1,Math.round(w*dpr));canvas.height=Math.max(1,Math.round(h*dpr));
  const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.scale(dpr,dpr);
  // Foil matches the ordinary board cell's color exactly: no hidden highlight/clue.
  const isBingo=canvas.dataset.foilType==='bingo',isBonus=canvas.dataset.foilType==='bonus';
  ctx.fillStyle=isBingo?'#304759':isBonus?'#514759':'#3b4d63';ctx.fillRect(0,0,w,h);
  for(let j=0;j<10;j++){ctx.fillStyle=j%2?'#ffffff12':'#23334214';ctx.fillRect(Math.random()*w,Math.random()*h,1.3,1.3)}
  ctx.fillStyle=isBingo?'#fff9ed':'#f7fcf9';
  ctx.font=`900 ${Math.max(9,Math.min(isBingo?14:12,h*.65))}px system-ui`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,w/2,h/2);

  const point=e=>{const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*w/r.width,y:(e.clientY-r.top)*h/r.height}};
  function erase(a,b){ctx.save();ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineWidth=Math.max(5,w*.30);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore()}
  function coverage(){const px=ctx.getImageData(0,0,canvas.width,canvas.height).data;let cleared=0,total=0;for(let y=Math.floor(canvas.height*.18);y<canvas.height*.82;y+=2)for(let x=Math.floor(canvas.width*.15);x<canvas.width*.85;x+=2){total++;if(px[(y*canvas.width+x)*4+3]<50)cleared++}return total?cleared/total:0}
  function check(){

    requestAnimationFrame(()=>{
      if(!canvas.isConnected)return;

      const left=markCount(t).remaining;
      const status=document.getElementById('playStatus');
      if(status)status.textContent=t.pending?`${(t.pendingShown||[]).length}/${t.pending.length} calls revealed · ${left} matches left`:left?`Scratch ${left} more matching spot${left===1?'':'s'} on your card`:'All matches found!';
      refreshPlayState(t);
      if(left===0&&!t.pending&&t.round>=5)settleTicket();
      restoreGamePan(position);
    });
  }
  canvas.addEventListener('pointerdown',e=>{if(panMode||pinching||complete)return;down=true;prev=point(e);try{canvas.setPointerCapture(e.pointerId)}catch(_){}erase(prev,prev);e.preventDefault()},{passive:false});
  canvas.addEventListener('pointermove',e=>{if(panMode||!down||pinching||complete)return;const p=point(e);erase(prev,p);prev=p;moves++;e.preventDefault()},{passive:false});
  canvas.addEventListener('pointerup',e=>{if(down&&!complete){down=false;check()}e.preventDefault()},{passive:false});

 }
}
