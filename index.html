function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function project(){return PROJECTS[S.projectIndex%PROJECTS.length]}
function projectTitle(){let n=Math.floor(S.projectIndex/PROJECTS.length)+1;return project().title+(n>1?` · Volume ${n}`:'')}
function gridNumbers(){const nums=[];for(let c=0;c<5;c++){let block=shuffle(Array.from({length:15},(_,i)=>i+c*15+1)).slice(0,5);for(let r=0;r<5;r++)nums[r*5+c]=block[r]};nums[12]=null;return nums}
function makeBingo(){return {cards:Array.from({length:6},gridNumbers),source:shuffle(Array.from({length:75},(_,i)=>i+1)).slice(0,29)}}
function makeBoard(n, base, maxWords){
 const grid=Array.from({length:n},()=>Array(n).fill(''));const entries=[];
 const r=Math.floor(n/2),c=Math.floor((n-base.length)/2);
 for(let i=0;i<base.length;i++)grid[r][c+i]=base[i];entries.push({word:base,r,c,dir:'across'});
 for(let word of shuffle(WORDS.filter(w=>w!==base && w.length<n-1)).slice(0,32)){
  const possible=[];
  for(let k=0;k<word.length;k++)for(let rr=0;rr<n;rr++)for(let cc=0;cc<n;cc++){
   if(grid[rr][cc]!==word[k])continue;
   for(let dir of ['down','across']){
    const dr=dir==='down'?1:0,dc=dir==='across'?1:0,sr=rr-k*dr,sc=cc-k*dc;
    if(sr<0||sc<0||sr+(word.length-1)*dr>=n||sc+(word.length-1)*dc>=n)continue;
    if(sr-dr>=0&&sc-dc>=0&&grid[sr-dr][sc-dc])continue;
    const er=sr+word.length*dr,ec=sc+word.length*dc;
    if(er<n&&ec<n&&grid[er][ec])continue;
    let crosses=0,valid=true;
    for(let i=0;i<word.length;i++){
     let y=sr+i*dr,x=sc+i*dc;
     if(grid[y][x]&&grid[y][x]!==word[i]){valid=false;break}
     if(grid[y][x]){crosses++;continue}
     for(let [ny,nx] of (dir==='down'?[[y,x-1],[y,x+1]]:[[y-1,x],[y+1,x]]))if(ny>=0&&ny<n&&nx>=0&&nx<n&&grid[ny][nx])valid=false;
     if(!valid)break;
    }
    if(valid&&crosses===1)possible.push({r:sr,c:sc,dir});
   }
  }
  if(!possible.length)continue;
  const p=possible[rand(possible.length)],dr=p.dir==='down'?1:0,dc=p.dir==='across'?1:0;
  for(let i=0;i<word.length;i++)grid[p.r+i*dr][p.c+i*dc]=word[i];
  entries.push({word,r:p.r,c:p.c,dir:p.dir});if(entries.length>=maxWords)break;
 }
 return {grid,words:entries};
}
function makeCrossword(){return {boards:[makeBoard(13,'TREASURE',11),makeBoard(9,'WALK',6)],bonusWord:['LUCKY','PRIZE','GOLD','SMILE','BONUS','HEART'][rand(6)],source:shuffle('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')).slice(0,20)}}
function makeTicket(type){return {id:Date.now(),type,round:0,pending:null,lastReveal:null,revealed:[],data:type==='bingo'?makeBingo():makeCrossword(),finished:false,prize:0,bonus:[],freeRoundsSpent:0}}
function bingoOutcomes(t){let counts={lines:0,corners:0,xs:0,prize:0};let seen=new Set(t.revealed);
 t.data.cards.forEach((cells,ci)=>{
  const hit=i=>i===12||seen.has(cells[i]);
  const lineSets=[];for(let r=0;r<5;r++)lineSets.push([0,1,2,3,4].map(c=>r*5+c));for(let c=0;c<5;c++)lineSets.push([0,1,2,3,4].map(r=>r*5+c));
  const lines=lineSets.filter(l=>l.every(hit)).length;
  const corners=[0,4,20,24].every(hit)?1:0;
  const x=[0,6,12,18,24,4,8,16,20].every(hit)?1:0;
  counts.lines+=lines;counts.corners+=corners;counts.xs+=x;
  counts.prize+=lines*(5+ci*3)+corners*25+x*60;
 });counts.prize=Math.min(120,counts.prize);return counts;
}
function completedWords(board,seen){return board.words.filter(w=>[...w.word].every(l=>seen.has(l)))}
function crossOutcomes(t){const seen=new Set(t.revealed),g1=completedWords(t.data.boards[0],seen).length,g2=completedWords(t.data.boards[1],seen).length;
 const bonus=[...t.data.bonusWord].every(l=>seen.has(l));
 const game1Prize=g1>=9?80:g1>=7?45:g1>=5?18:g1>=3?8:0;
 const game2Prize=g2>=5?30:g2>=4?18:g2>=3?8:g2>=2?3:0;
 return {g1,g2,total:g1+g2,bonus,game1Prize,game2Prize,prize:Math.min(120,game1Prize+game2Prize+(bonus?8:0))};
}
function getPrize(t){return t.type==='bingo'?bingoOutcomes(t).prize:crossOutcomes(t).prize}
function ticketProgress(t){if(t.type==='bingo'){let o=bingoOutcomes(t);return `${o.lines} line${o.lines===1?'':'s'} · ${o.corners} four-corner bonus${o.corners===1?'':'es'}${o.xs?' · X bonus!':''}`;}let o=crossOutcomes(t);return `Game 1: ${o.g1} words · Game 2: ${o.g2} words${o.bonus?' · bonus word!':''}`}
function migrate(){if(S.rulesVersion>=2)return;
 if(S.ticket&&S.ticket.finished&&(!TYPES[S.ticket.type]||(S.ticket.type==='bingo'&&!S.ticket.data.cards)||(S.ticket.type==='crossword'&&!S.ticket.data.boards))){S.ticket=null;notice='Older finished ticket is preserved in your statistics. New two-game tickets are ready.';}
 if(S.ticket&&!S.ticket.finished&&(!TYPES[S.ticket.type]|| (S.ticket.type==='bingo'&&!S.ticket.data.cards)||(S.ticket.type==='crossword'&&!S.ticket.data.boards))){
  const t=S.ticket;S.coins+=TICKET_COST+ROUND_COST*(t.round+(t.pending?1:0));S.history.unshift({type:t.type,prize:0,when:new Date().toISOString(),retired:true});S.ticket=null;notice='Classic ticket converted to the new format. Its ticket and round costs were returned to your coin wallet. Your steps, coins and collection were kept.';
 }
 S.rulesVersion=2;save();
}
migrate();
function setNotice(m){notice=m;render()}
function handle(action,arg){
 if(action==='tab'){view=arg;notice='';return render()}
 if(action==='pick'){selected=arg;return render()}
 if(action==='addSteps'){S.bank+=Number(arg);save();return setNotice(`Added ${Number(arg).toLocaleString()} simulated steps.`)}
 if(action==='exchange'||action==='exchangeAll'){const count=action==='exchange'?1:Math.floor(S.bank/RATE);if(count<1)return;S.bank-=count*RATE;S.coins+=count*COINS_PER_RATE;S.stats.walkCoins+=count*COINS_PER_RATE;save();return setNotice(`Exchanged ${count*RATE} simulated steps for ${count*COINS_PER_RATE} coins.`)}
 if(action==='buyTicket'){
  if(S.ticket&&!S.ticket.finished)return setNotice('Finish your current ticket first.');
  if(S.freeTickets>0)S.freeTickets--;else if(S.coins>=TICKET_COST)S.coins-=TICKET_COST;else return setNotice('You need 30 coins for a ticket. Exchange some banked steps.');
  S.ticket=makeTicket(selected);S.stats.tickets++;save();return setNotice(`${TYPES[selected].label} ticket ready! Five rounds to complete.`);
 }
 if(action==='buyRound'){
  const t=S.ticket;if(!t||t.finished||t.pending||t.round>=5)return;
  if(S.freeRounds>0){S.freeRounds--;t.freeRoundsSpent++}else if(S.coins>=ROUND_COST)S.coins-=ROUND_COST;else return setNotice('You need 10 coins for your next round.');
  if(t.type==='bingo'){const offsets=[0,6,12,18,24],sizes=[6,6,6,6,5];t.pending=t.data.source.slice(offsets[t.round],offsets[t.round]+sizes[t.round]);}
  else t.pending=t.data.source.slice(t.round*4,t.round*4+4);
  t.lastReveal=null;notice='';save();render();document.querySelector('.scratch-tray')?.scrollIntoView({block:'center',behavior:'instant'});return;
 }
 if(action==='finishScratch'){
  const t=S.ticket;if(!t||!t.pending)return;
  t.lastReveal=[...t.pending];t.revealed.push(...t.pending);t.pending=null;t.round++;S.stats.rounds++;
  const messages=[];
  if(Math.random()<.085){S.freeRounds++;messages.push('Bonus: one free scratch round!')}
  if(Math.random()<.07){S.coins+=5;S.stats.winCoins+=5;messages.push('Bonus: 5 coins!')}
  if(Math.random()<.045){S.packs++;messages.push('Bonus: one mystery pack!')}
  if(t.round>=5){t.finished=true;t.prize=getPrize(t);S.coins+=t.prize;S.stats.winCoins+=t.prize;
   if(Math.random()<.12){S.packs++;t.bonus.push('Mystery pack')}
   if(Math.random()<.025){S.freeTickets++;t.bonus.push('Free ticket')}
   S.history.unshift({type:t.type,prize:t.prize,when:new Date().toISOString()});S.history=S.history.slice(0,20);
   messages.push(t.prize?`Ticket complete! You won ${t.prize} virtual coins.`:'Ticket complete! No coin prize this time.');
  }else messages.push(`Round ${t.round} revealed. ${ticketProgress(t)}`);
  notice=messages.join('  ');save();render();return;
 }
 if(action==='buyPack'){if(S.coins<PACK_COST)return setNotice('You need 50 coins for a pack.');if(S.owned.length===12)return setNotice('Start the next collection first.');S.coins-=PACK_COST;S.packs++;save();return setNotice('Mystery pack added to your vault.')}
 if(action==='tradeDup'){if(S.duplicates<3||S.owned.length===12)return;S.duplicates-=3;S.packs++;save();return setNotice('Three duplicates traded for one mystery pack.')}
 if(action==='openPack'){if(S.packs<1||S.owned.length===12)return;S.packs--;const p=project(),results=[];
  for(let k=0;k<2;k++){const weights=p.items.map((_,i)=>i<7?9:i<10?5:2);let roll=Math.random()*weights.reduce((a,b)=>a+b,0),picked=0;
   for(let i=0;i<weights.length;i++){roll-=weights[i];if(roll<0){picked=i;break}}
   const duplicate=S.owned.includes(picked);if(duplicate)S.duplicates++;else S.owned.push(picked);
   results.push({name:p.items[picked][1],emoji:p.items[picked][0],duplicate,rarity:picked<7?'Common':picked<10?'Uncommon':'Rare'});
  }
  S.packResults=results;save();return render();
 }
 if(action==='clearResults'){S.packResults=null;save();return render()}
 if(action==='nextProject'){if(S.owned.length!==12)return;S.completed.push({index:S.projectIndex,name:projectTitle()});S.projectIndex++;S.owned=[];S.duplicates=0;S.packResults=null;S.stats.projects++;save();return setNotice('Collection completed! A new kind of project has started.')}
 if(action==='export'){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='step-scratchers-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);return}
 if(action==='import'){document.getElementById('restoreFile')?.click();return}
 if(action==='reset'){if(!confirm('Erase all demo progress and start with 6,000 simulated steps?'))return;S=initial();S.rulesVersion=2;selected='bingo';view='scratch';notice='Demo reset.';save();return render()}
}
function callerHtml(t){const seen=new Set(t.revealed);const recent=new Set(t.lastReveal||[]);const block=(s,a)=>`<div class="calls-grid ${s}">${a.map(n=>`<div class="called-number ${seen.has(n)?'revealed':''} ${recent.has(n)?'recent':''} ${s==='bonus'?'bonus':''}">${seen.has(n)?n:'?'}</div>`).join('')}</div>`;
 const nums=t.data.source;return `<div class="calls-card"><div class="row"><strong>CALLER'S CARD</strong><small class="rule-small">${t.revealed.length} of 29 calls</small></div>${block('',nums.slice(0,24))}<div class="label" style="margin-top:8px">5 bonus numbers</div>${block('bonus',nums.slice(24))}<p class="rule-small">Each scratch round reveals new numbers. Matching spaces are marked on all six cards automatically.</p></div>`;
}
function miniBingoHtml(cells,t,ci){let seen=new Set(t.revealed);let hit=i=>i===12||seen.has(cells[i]);let rows=0,cols=0;for(let r=0;r<5;r++)if([0,1,2,3,4].every(c=>hit(r*5+c)))rows++;for(let c=0;c<5;c++)if([0,1,2,3,4].every(r=>hit(r*5+c)))cols++;
 const got=rows+cols;return `<div class="mini-bingo"><div class="mini-bingo-header"><strong>CARD ${ci+1}</strong><small>${got} line${got===1?'':'s'}</small></div><div class="mini-bingo-grid">${'BINGO'.split('').map(x=>`<div class="mini-bingo-letter">${x}</div>`).join('')}${cells.map((n,i)=>`<div class="mini-bingo-cell ${i===12?'free':seen.has(n)?'hit':''}">${i===12?'FREE':n}</div>`).join('')}</div><div class="mini-bingo-bonus">Line: ${5+ci*3} coins</div></div>`}
function bingoHtml(t){const o=bingoOutcomes(t);return `<div class="ticket-top"><strong>Six-card Bingo</strong><span>Scratch the caller numbers. Match lines, corners, or an X across your boards.</span></div>${callerHtml(t)}<div class="bingo-six">${t.data.cards.map((c,i)=>miniBingoHtml(c,t,i)).join('')}</div><div class="prize-strip"><div class="prize-chip"><strong>${o.lines}</strong><small>Winning lines</small></div><div class="prize-chip"><strong>${o.corners}</strong><small>Four-corners</small></div><div class="prize-chip"><strong>${o.xs}</strong><small>X patterns</small></div></div><p class="rule-small">Bonus patterns: four corners = 25 coins, X = 60 coins. Total ticket payout is capped at 120 coins.</p>`}
function wordGrid(board,t){const seen=new Set(t.revealed),finished=new Set();for(let w of completedWords(board,seen))for(let i=0;i<w.word.length;i++)finished.add(`${w.r+(w.dir==='down'?i:0)},${w.c+(w.dir==='across'?i:0)}`);
 let n=board.grid.length;return `<div class="crossword-board" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${board.grid.map((row,r)=>row.map((l,c)=>{if(!l)return '<div class="crosscell blank"></div>';let called=seen.has(l),found=finished.has(`${r},${c}`);return `<div class="crosscell ${found?'found':called?'called':''}">${l}</div>`}).join('')).join('')}</div>`}
function crosswordHtml(t){const o=crossOutcomes(t);const recent=new Set(t.lastReveal||[]),seen=new Set(t.revealed);return `<div class="ticket-top"><strong>Crossword Scratcher</strong><span>Reveal 20 letters across five rounds; completed words highlight automatically.</span></div><div class="calls-card"><div class="row"><strong>YOUR 20 LETTERS</strong><small class="rule-small">${t.revealed.length} / 20 revealed</small></div><div class="letter-bank">${t.data.source.map(l=>`<div class="letter-cell ${seen.has(l)?'called':''}">${seen.has(l)?l:'?'}</div>`).join('')}</div><p class="rule-small">No word solving required: the highlighted letters count toward words in both boards.</p></div><div class="crossword-sheet">${t.data.boards.map((b,i)=>`<div class="crossword-paper"><div class="row"><strong>GAME ${i+1}</strong><span class="pill">${i===0?o.g1:o.g2} words · ${i===0?o.game1Prize:o.game2Prize} coins</span></div>${wordGrid(b,t)}</div>`).join('')}</div><div class="bonus-word ${o.bonus?'done':''}"><div><div class="label">BONUS WORD</div><strong>${esc(t.data.bonusWord)}</strong></div><span class="pill">${o.bonus?'COMPLETE +8':'Complete = +8'}</span></div><div class="prize-strip"><div class="prize-chip"><strong>Game 1: 3 words</strong><small>8 coins</small></div><div class="prize-chip"><strong>Game 1: 5 words</strong><small>18 coins</small></div><div class="prize-chip"><strong>Game 1: 7 words</strong><small>45 coins</small></div></div><p class="rule-small">Each crossword game pays its own prize. Game 1 awards 80 coins for 9+ words. Game 2 pays 3 coins for 2 words, 8 for 3, 18 for 4, and 30 for 5. A completed bonus word adds 8 coins.</p>`}
function scratchTrayHtml(t){const visible=t.pending||t.lastReveal;if(!visible)return '';

 return `${footer}<div class="card"><div class="sectionline"><div><div class="kicker">Ticket counter</div><h2>Choose your next scratcher</h2></div><span class="pill">30 coins</span></div><div class="select-grid">${Object.entries(TYPES).map(([k,x])=>`<button class="select-game ${selected===k?'selected':''}" data-act="pick" data-arg="${k}"><span class="em">${x.icon}</span><strong>${x.label}</strong><small>5 rounds</small></button>`).join('')}</div><div class="callout" style="margin:14px 0">One active ticket at a time. Bingo has six cards and a caller's card; Crossword has two word grids plus a bonus word.</div><button class="btn wide" data-act="buyTicket" ${S.coins<TICKET_COST&&S.freeTickets===0?'disabled':''}>${S.freeTickets>0?'Use free ticket':'Buy ticket · 30 coins'}</button><p class="note" style="margin-top:11px">Each of the five scratch rounds costs 10 coins, unless you have a free round.</p></div>`;

 return html+'</div>';

 return h+`<div class="card soft"><h3>Completed collection gallery</h3>${S.completed.length?`<p class="sub" style="margin-top:9px">${S.completed.map(c=>'✓ '+esc(c.name)).join(' · ')}</p>`:'<p class="sub" style="margin-top:9px">Your finished projects appear here.</p>'}</div>`;
}
function walletHtml(){return `<div class="card"><div class="sectionline"><div><div class="kicker">Test the economy</div><h2>Walk → coins → scratch</h2></div></div><div class="callout gold">This version uses simulated steps, not real Apple Health data yet.</div><div class="kpi-row"><div class="kpi"><strong>${Math.floor(S.bank/RATE)}</strong><small>Exchange units</small></div><div class="kpi"><strong>${S.freeRounds}</strong><small>Free rounds</small></div><div class="kpi"><strong>${S.freeTickets}</strong><small>Free tickets</small></div></div><p class="label">Add pretend walking</p><div class="row" style="margin:10px 0 18px;justify-content:stretch"><button class="btn alt" style="flex:1" data-act="addSteps" data-arg="547">+547 steps</button><button class="btn alt" style="flex:1" data-act="addSteps" data-arg="1000">+1,000</button><button class="btn alt" style="flex:1" data-act="addSteps" data-arg="6000">+6,000</button></div><div class="row" style="gap:8px"><button class="btn" style="flex:1" data-act="exchange" ${S.bank<RATE?'disabled':''}>Cash 547 → 10 coins</button><button class="btn alt" style="flex:1" data-act="exchangeAll" ${S.bank<RATE?'disabled':''}>Cash all available</button></div><p class="note" style="margin-top:10px">Leftover steps and coins carry over indefinitely. Redeemed steps cannot be used twice.</p></div><div class="card"><h3>Your game statistics</h3><div class="kpi-row"><div class="kpi"><strong>${S.stats.tickets}</strong><small>Tickets bought</small></div><div class="kpi"><strong>${S.stats.rounds}</strong><small>Rounds scratched</small></div><div class="kpi"><strong>${S.stats.projects}</strong><small>Projects finished</small></div></div><div class="row"><span class="sub">Coins from walking</span><strong>${S.stats.walkCoins}</strong></div><div class="rule"></div><div class="row"><span class="sub">Coins won in scratchers</span><strong>${S.stats.winCoins}</strong></div></div><div class="card soft"><h3>Save or reset</h3><p class="sub" style="margin:8px 0 12px">Progress is stored in this browser. Download a backup before clearing website data or moving to another browser.</p><div class="row"><button class="btn tiny alt" data-act="export">Export save</button><button class="btn tiny alt" data-act="import">Import save</button><button class="btn tiny ghost" data-act="reset">Reset demo</button></div><input type="file" id="restoreFile" accept="application/json,.json" style="display:none" aria-label="Choose saved game file"></div>`}
function render(){const root=document.getElementById('app');root.innerHTML=`<div class="topbar"><div><div class="kicker">Your walking-powered scratchers</div><div class="brand">STEP <span>SCRATCHERS</span></div></div><div class="demo">PLAYABLE DEMO V2</div></div><div class="wallet"><div class="stat"><small>👟 Step bank</small><strong>${S.bank.toLocaleString()}</strong><em>steps</em></div><div class="stat"><small>🪙 Virtual wallet</small><strong>${S.coins.toLocaleString()}</strong><em>coins</em></div></div><div class="nav"><button class="${view==='scratch'?'active':''}" data-act="tab" data-arg="scratch">🎟️ Scratch</button><button class="${view==='collect'?'active':''}" data-act="tab" data-arg="collect">📚 Collect</button><button class="${view==='wallet'?'active':''}" data-act="tab" data-arg="wallet">👟 Step Bank</button></div>${notice?`<div class="notice" role="status">${esc(notice)}</div>`:''}${view==='scratch'?ticketHtml():view==='collect'?collectHtml():walletHtml()}<div class="bottom">Version 2 · No ads · No payments · No GPS · Virtual rewards only<br>One active scratcher · Endless tickets and rotating collections</div>`;
 for(let el of root.querySelectorAll('[data-act]'))el.addEventListener('click',()=>handle(el.dataset.act,el.dataset.arg));
 const f=document.getElementById('restoreFile');if(f)f.addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.version!==1||!Number.isFinite(data.bank)||!Number.isFinite(data.coins)||!Array.isArray(data.owned)||!data.stats)throw new Error('Incompatible save');if(!confirm('Replace current progress with this saved file?'))return;S=data;S.rulesVersion=1;migrate();view='scratch';setNotice('Save imported. Your progress has been restored.')}catch(err){alert('Could not import this file: '+err.message)}});
 if(S.ticket?.pending&&view==='scratch')setupScratch();
}
function setupScratch(){const canvas=document.getElementById('foil');if(!canvas)return;const rect=canvas.getBoundingClientRect();if(rect.width<10)return;
 const w=rect.width,h=rect.height,dpr=Math.min(3,window.devicePixelRatio||1);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.scale(dpr,dpr);
 const silver=ctx.createLinearGradient(0,0,w,h);silver.addColorStop(0,'#b0b5b1');silver.addColorStop(.3,'#e2e4de');silver.addColorStop(.6,'#a1aaa7');silver.addColorStop(1,'#c5ccc7');ctx.fillStyle=silver;ctx.fillRect(0,0,w,h);
 // Matte ticket foil texture, intentionally static and subtle.
 for(let i=0;i<Math.min(2000,Math.floor(w*h/45));i++){const x=Math.random()*w,y=Math.random()*h;ctx.fillStyle=i%2?'rgba(255,255,255,.18)':'rgba(62,73,69,.10)';ctx.fillRect(x,y,1.2+Math.random()*2,.5+Math.random())}
 ctx.fillStyle='#405053';ctx.font='800 21px ui-rounded,system-ui';ctx.textAlign='center';ctx.fillText('SCRATCH HERE',w/2,h/2-5);ctx.font='600 12px ui-rounded,system-ui';ctx.fillText('rub away the silver covering',w/2,h/2+19);
 let down=false,prev=null,moves=0,done=false;
 function point(e){let b=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(w,e.clientX-b.left)),y:Math.max(0,Math.min(h,e.clientY-b.top))}}
 function stroke(a,b){ctx.save();ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=21;
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.beginPath();ctx.arc(b.x,b.y,10.5,0,Math.PI*2);ctx.fill();
  // fine irregular edges make a real rubbed-off look, without animated effects
  const dx=b.x-a.x,dy=b.y-a.y,length=Math.hypot(dx,dy),n=Math.min(14,Math.floor(length/5));
  for(let i=0;i<n;i++){let f=(i+1)/(n+1),x=a.x+dx*f,y=a.y+dy*f,offset=(i%2?1:-1)*(10+Math.random()*4);ctx.beginPath();ctx.arc(x+(-dy/(length||1))*offset,y+(dx/(length||1))*offset,1.5+Math.random()*2.5,0,Math.PI*2);ctx.fill()}
  ctx.restore();}
 function proportion(){let pix=ctx.getImageData(0,0,canvas.width,canvas.height).data,clear=0,total=0,step=Math.max(1,Math.round(dpr*7)),ww=canvas.width,hh=canvas.height;
 for(let y=step>>1;y<hh;y+=step)for(let x=step>>1;x<ww;x+=step){total++;if(pix[(y*ww+x)*4+3]<24)clear++}return total?clear/total:0}
 function check(){if(done)return;if(proportion()>=.97){done=true;down=false;handle('finishScratch')}}
 canvas.addEventListener('pointerdown',e=>{if(done)return;down=true;prev=point(e);try{canvas.setPointerCapture(e.pointerId)}catch(_){}stroke(prev,prev);e.preventDefault()},{passive:false});
 canvas.addEventListener('pointermove',e=>{if(!down||done)return;let p=point(e);stroke(prev,p);prev=p;moves++;if(moves%11===0)check();e.preventDefault()},{passive:false});
 canvas.addEventListener('pointerup',e=>{if(down&&!done){down=false;prev=null;check()}e.preventDefault()},{passive:false});canvas.addEventListener('pointercancel',()=>{down=false;prev=null});
}
render();
})();

</script></body></html>
